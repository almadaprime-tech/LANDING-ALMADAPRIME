<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title>Almada Prime</title>
  <desc>Logotipo minimalista da Almada Prime, monograma AP em dourado sobre fundo preto</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#E9DCB1" />
      <stop offset="1" stop-color="#B89245" />
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="28" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="40" fill="#070609" />
  <g transform="translate(50,60)" filter="url(#f)">
    <g transform="translate(20,10)">
      <path d="M120 40 L120 200" stroke="url(#g)" stroke-width="18" stroke-linecap="round" />
      <path d="M120 120 C80 60 20 60 0 120" stroke="url(#g)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M120 120 C160 60 220 60 240 120" stroke="url(#g)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
  <text x="200" y="330" font-family="'Playfair Display', serif" font-size="28" fill="url(#g)" text-anchor="middle" letter-spacing="0.14em">Almada Prime</text>
</svg>